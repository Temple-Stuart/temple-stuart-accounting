<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOME-TRIM-03 · reference</title>
<!--
  HOME-TRIM-03: the reference for Professional Services on the guest landing, short. The section's name and its line,
  the question with its six services, then the picked service's name and line, its gold button and its note, and one
  link under the panel. The picture and the three steps leave the home page. /professional-services keeps the whole
  section, unchanged.

  Open this file in a browser. Press a service: its name, its line and the button's link follow it. Resize the window:
  when there is room the service's words and its button stand in one row; on a narrower window the button stands under
  the words.

  The first stylesheet is design-refs/home-services-01's, byte for byte. It is on main already, ported as .ts-ps…, and is
  not ported again (its form's rules are HOME-SERVICES-02's and stay unported). The second is what the short view adds:
  it is the only part to port. Every value in it is the design, and the markup is the page at rest. The words are
  copies, for placement only: production reads each one from its home (the README lists them) and types none. The
  script at the foot only makes this file work on its own: production keeps the pick in React state. The font link is
  here only so the file renders alone; the site already loads both faces.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    /* ALREADY IN THE APP: each is the same name behind the house prefix (--hero-violet-2 is --ts-hero-violet-2,
       --bg is --ts-bg). Declared here only so this file renders on its own; the port adds none of these. */
    --bg: 250 248 243;                /* the cream ground; the form's two inset boxes */
    --border: 221 214 232;            /* the line under the section */
    --red: 197 48 48;                 /* the form's error, at 0.3 (border), 0.06 (fill) and solid (text) */
    --hero-violet-2: #4D1FBC;         /* the picked tile; icons; the steps' marks; picks that are on; the focus ring */
    --hero-violet-3: #32118A;         /* the picked service's chip; the add-link button's label */
    --hero-violet-4: #210A5E;         /* headings, tile titles and the thank-you */
    --hero-gold-1: 255 236 178;       /* the gold button, start */
    --hero-gold-2: 248 203 90;        /* the gold button, 52% */
    --hero-gold-3: 236 178 62;        /* the gold button, end */
    --hero-on-gold: #2A0F5C;          /* ink on the gold button */

    /* ADDED BY HOME-PLANS-04 (design-refs/home-plans-04): reused here, by the same names and values. If that PR
       ported them under other names, use its names; add none of these twice. */
    --fs-white: 255 255 255;          /* the panel, tiles, chips and fields; text on violet; the gold button's top light at 0.75 */
    --fs-ink: #2B2545;                /* body text; the form's labels and what is typed */
    --fs-ink-soft: #4A4560;           /* the lede, the service's line, the chips, the notes, the bookkeeping box's last line */
    --fs-ink-muted: #6F6988;          /* tile kinds; step 3's mark and note; hints; placeholders */
    --fs-gold-text: #8A6408;          /* the form's eyebrow */
    --fs-line: #E9E4F2;               /* the panel's border */
    --fs-rule: #EEEAF5;               /* the rules inside it */
    --fs-chip-line: #E4DFF0;          /* the border of a tile, a chip and the Close button */
    --fs-button-line: #CFC6EC;        /* step 3's ring; the picked chip's border; the thank-you's border; the Project details underline */
    --fs-band-muted: #D6CCF7;         /* the picked tile's kind */
    --fs-shadow: 33 10 94;            /* shadows on the cream: hero-violet-4 as channels */

    /* NEW WITH THIS SECTION */
    --ps-field-line: #DCD5EC;         /* the border of a field and a pick; the steps' wire */
    --ps-wash: #F6F2FE;               /* the picked chip's fill; the thank-you's fill */
    --ps-art: #F3EFFC;                /* the picture's frame: its flat colour, under its gradients */
    --ps-art-1: #F8F5FE;              /* the frame's gradient, start */
    --ps-art-2: #ECE6FA;              /* the frame's gradient, end */
    --ps-art-ring: 77 31 188;         /* the frame's rings, at 0.05: hero-violet-2 as channels */
  }

  /* ── 1 · the section ─────────────────────────────────────────────────────────────────────────── */
  .ps { scroll-margin-top: 48px; border-bottom: 1px solid rgb(var(--border)); background-color: rgb(var(--bg)); color: var(--fs-ink); font-family: 'Inter', sans-serif; line-height: 1.5; }
  .ps__inner { box-sizing: border-box; max-width: 1280px; margin-inline: auto; padding: clamp(44px, 5.6vw, 80px) 16px clamp(52px, 6.2vw, 88px); }
  .ps__title { margin: 0; font-size: clamp(34px, 4vw, 56px); line-height: 1.05; font-weight: 500; letter-spacing: -0.03em; color: var(--hero-violet-4); }
  .ps__lede { margin: 16px 0 0; max-width: 620px; font-size: clamp(16px, 1.4vw, 19px); line-height: 1.55; color: var(--fs-ink-soft); text-wrap: pretty; }
  .ps :focus-visible { outline: 2px solid var(--hero-violet-2); outline-offset: 3px; }
  .ps [hidden] { display: none; }               /* the one rule for everything the section hides; it outranks each block's own display */

  /* ── 2 · the panel: the question and the six services ────────────────────────────────────────── */
  .ps-panel {
    box-sizing: border-box; margin-top: clamp(24px, 2.8vw, 40px); padding: clamp(18px, 2.3vw, 32px);
    border: 1px solid var(--fs-line); border-radius: 24px; background-color: rgb(var(--fs-white));
    box-shadow: 0 1px 2px rgb(var(--fs-shadow) / 0.05), 0 20px 48px rgb(var(--fs-shadow) / 0.08);
  }
  .ps-panel__question { margin: 0; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; color: var(--hero-violet-4); }

  .ps-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: clamp(8px, 1vw, 12px); margin-top: 16px; }
  .ps-tile {
    box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 14px;
    min-height: 104px; margin: 0; padding: 14px 14px 12px; border: 1px solid var(--fs-chip-line); border-radius: 14px;
    background-color: rgb(var(--fs-white)); color: var(--hero-violet-2); font-family: inherit; text-align: left; cursor: pointer;
    transition: background-color 0.16s, border-color 0.16s, box-shadow 0.16s;
  }
  .ps-tile__icon { flex: none; }
  .ps-tile__words { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ps-tile__title { font-size: 14px; line-height: 1.3; font-weight: 600; color: var(--hero-violet-4); }
  .ps-tile__kind { min-height: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; line-height: 1.3; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fs-ink-muted); }
  /* the picked service: filled violet */
  .ps-tile[aria-pressed="true"] { border-color: var(--hero-violet-2); background-color: var(--hero-violet-2); color: rgb(var(--fs-white)); box-shadow: 0 8px 20px rgb(var(--fs-shadow) / 0.18); }
  .ps-tile[aria-pressed="true"] .ps-tile__title { color: rgb(var(--fs-white)); }
  .ps-tile[aria-pressed="true"] .ps-tile__kind { color: var(--fs-band-muted); }

  /* ── 3 · the stage: the picked service's picture, its words, how it goes, the button ─────────── */
  .ps-stage {
    display: flex; flex-direction: column; gap: clamp(20px, 2.6vw, 40px);
    margin-top: clamp(18px, 1.8vw, 24px); padding-top: clamp(18px, 1.8vw, 24px); border-top: 1px solid var(--fs-rule);
  }
  .ps-stage__art {
    box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-width: 0;
    padding: clamp(12px, 1.6vw, 24px); border-radius: 18px;
    background-color: var(--ps-art);
    background-image:
      repeating-radial-gradient(circle at 50% 260%, rgb(var(--ps-art-ring) / 0) 0px, rgb(var(--ps-art-ring) / 0) 15px, rgb(var(--ps-art-ring) / 0.05) 15px, rgb(var(--ps-art-ring) / 0.05) 16px),
      linear-gradient(135deg, var(--ps-art-1) 0%, var(--ps-art-2) 100%);
  }
  .ps-stage__art img { display: block; width: 100%; max-width: 560px; height: auto; }
  .ps-stage__text { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .ps-stage__title { margin: 0; font-size: clamp(24px, 2.2vw, 30px); line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; color: var(--hero-violet-4); }
  .ps-stage__line { margin: 10px 0 0; max-width: 540px; font-size: 16px; line-height: 1.55; color: var(--fs-ink-soft); text-wrap: pretty; }

  .ps-steps { display: flex; flex-direction: column; margin: 20px 0 0; padding: 0; list-style: none; }
  .ps-step { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 12px; }
  .ps-step__rail { display: flex; flex-direction: column; align-items: center; }
  .ps-step__wire { flex: 1; width: 1.5px; min-height: 12px; margin: 4px 0; background-color: var(--ps-field-line); }
  .ps-step__mark {
    box-sizing: border-box; flex: none; display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 1.5px solid var(--fs-button-line); border-radius: 50%;
    font-size: 13px; line-height: 1; font-weight: 600; color: var(--fs-ink-muted);
  }
  .ps-step[data-step="done"] .ps-step__mark { border-color: var(--hero-violet-2); background-color: var(--hero-violet-2); color: rgb(var(--fs-white)); }
  .ps-step[data-step="now"] .ps-step__mark { border-color: var(--hero-violet-2); color: var(--hero-violet-2); }
  .ps-step__body { min-width: 0; padding-bottom: 14px; }
  .ps-step:last-child .ps-step__body { padding-bottom: 0; }
  .ps-step__title { margin: 0; padding-top: 3px; font-size: 15px; line-height: 1.35; font-weight: 600; color: var(--hero-violet-4); }
  .ps-step__note { margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: var(--fs-ink-muted); }
  .ps-chips { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
  .ps-chip {
    box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border: 1px solid var(--fs-chip-line); border-radius: 8px; background-color: rgb(var(--fs-white)); color: var(--fs-ink-soft);
    font-size: 13px; line-height: 1.2; font-weight: 500; white-space: nowrap;
  }
  .ps-chip--picked { border-color: var(--fs-button-line); background-color: var(--ps-wash); color: var(--hero-violet-3); font-weight: 600; }

  .ps-cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 22px; }
  .ps-cta {
    box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 48px; margin: 0; padding: 0 26px;
    border: 0; border-radius: 999px; background-color: rgb(var(--hero-gold-2)); background-image: linear-gradient(135deg, rgb(var(--hero-gold-1)) 0%, rgb(var(--hero-gold-2)) 52%, rgb(var(--hero-gold-3)) 100%);
    box-shadow: inset 0 1px 0 rgb(var(--fs-white) / 0.75), 0 8px 20px rgb(var(--fs-shadow) / 0.16); color: var(--hero-on-gold);
    font-family: inherit; font-size: 15px; line-height: 1.2; font-weight: 600; white-space: nowrap; text-decoration: none; cursor: pointer;
    transition: filter 0.16s;
  }
  .ps-cta:disabled { cursor: not-allowed; opacity: 0.5; }
  .ps-note { font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.3; font-weight: 500; color: var(--fs-ink-soft); }

  /* ── 4 · the form, in place (HOME-SERVICES-02) ──────────────────────────────────────────────── */
  .ps-form { margin-top: clamp(22px, 2.4vw, 32px); padding-top: clamp(22px, 2.4vw, 32px); border-top: 1px solid var(--fs-rule); }
  .ps-form__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .ps-form__eyebrow { margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.3; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fs-gold-text); }
  .ps-close {
    box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; height: 40px; margin: 0; padding: 0 14px;
    border: 1px solid var(--fs-chip-line); border-radius: 999px; background-color: rgb(var(--fs-white)); color: var(--fs-ink-soft);
    font-family: inherit; font-size: 13px; line-height: 1.2; font-weight: 600; cursor: pointer;
  }
  .ps-fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px clamp(16px, 2vw, 28px); max-width: 860px; margin-top: 18px; }
  .ps-fields--more { margin-top: 12px; padding: clamp(14px, 1.6vw, 20px); border-radius: 14px; background-color: rgb(var(--bg)); }
  .ps-field { min-width: 0; }
  .ps-field--wide { grid-column: 1 / -1; }
  .ps-label { display: block; margin: 0 0 7px; font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--fs-ink); }
  .ps-input, .ps-area {
    box-sizing: border-box; display: block; width: 100%; margin: 0; border: 1px solid var(--ps-field-line); border-radius: 12px;
    background-color: rgb(var(--fs-white)); color: var(--fs-ink); font-family: inherit; font-size: 15px;
  }
  .ps-input { height: 46px; padding: 0 14px; line-height: 1.2; }
  .ps-area { min-height: 84px; padding: 12px 14px; line-height: 1.5; resize: vertical; }
  .ps-input::placeholder, .ps-area::placeholder { color: var(--fs-ink-muted); opacity: 1; }
  .ps-input:disabled { opacity: 0.5; }
  .ps-input:focus-visible, .ps-area:focus-visible { outline-offset: 1px; border-color: var(--hero-violet-2); }
  .ps-hint { margin: 7px 0 0; font-size: 13px; line-height: 1.45; color: var(--fs-ink-muted); }
  .ps-picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .ps-pick {
    box-sizing: border-box; display: inline-flex; align-items: center; height: 38px; margin: 0; padding: 0 14px;
    border: 1px solid var(--ps-field-line); border-radius: 999px; background-color: rgb(var(--fs-white)); color: var(--fs-ink-soft);
    font-family: inherit; font-size: 14px; line-height: 1.2; font-weight: 500; white-space: nowrap; cursor: pointer;
    transition: background-color 0.16s, border-color 0.16s, color 0.16s;
  }
  .ps-pick[aria-pressed="true"] { border-color: var(--hero-violet-2); background-color: var(--hero-violet-2); color: rgb(var(--fs-white)); font-weight: 600; }
  .ps-pick--below { margin-top: 8px; }
  .ps-offer { grid-column: 1 / -1; box-sizing: border-box; padding: clamp(14px, 1.6vw, 20px); border-radius: 14px; background-color: rgb(var(--bg)); }
  .ps-offer p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--fs-ink); text-wrap: pretty; }
  .ps-offer p + p { margin-top: 10px; }
  .ps-offer p:last-child { margin-top: 6px; color: var(--fs-ink-soft); }
  .ps-more { display: inline-flex; align-items: center; min-height: 32px; margin: 0; padding: 0; border: 0; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.3; font-weight: 500; color: var(--fs-ink-soft); text-decoration: underline; text-decoration-color: var(--fs-button-line); text-underline-offset: 4px; cursor: pointer; }
  .ps-links { display: flex; flex-direction: column; gap: 8px; }
  .ps-link { display: flex; align-items: center; gap: 8px; }
  .ps-link__remove {
    box-sizing: border-box; flex: none; display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; margin: 0; padding: 0;
    border: 1px solid var(--ps-field-line); border-radius: 12px; background-color: rgb(var(--fs-white)); color: var(--fs-ink-muted); font-family: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  .ps-add {
    box-sizing: border-box; display: inline-flex; align-items: center; height: 38px; margin: 8px 0 0; padding: 0 14px;
    border: 1px solid var(--ps-field-line); border-radius: 999px; background-color: rgb(var(--fs-white)); color: var(--hero-violet-3);
    font-family: inherit; font-size: 14px; line-height: 1.2; font-weight: 600; cursor: pointer;
  }
  .ps-error { grid-column: 1 / -1; box-sizing: border-box; padding: 12px 14px; border: 1px solid rgb(var(--red) / 0.3); border-radius: 12px; background-color: rgb(var(--red) / 0.06); color: rgb(var(--red)); font-size: 14px; line-height: 1.5; }
  .ps-send { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  .ps-sent {
    display: flex; align-items: flex-start; gap: 12px; max-width: 860px; margin-top: 18px; padding: 16px 18px; border: 1px solid var(--fs-button-line); border-radius: 14px;
    background-color: var(--ps-wash); color: var(--hero-violet-4); font-size: 15px; line-height: 1.55;
  }
  .ps-sent .ps-step__mark { border-color: var(--hero-violet-2); background-color: var(--hero-violet-2); color: rgb(var(--fs-white)); }
  .ps-sent p { margin: 2px 0 0; }

  /* ── 5 · wider windows ───────────────────────────────────────────────────────────────────────── */
  @media (min-width: 480px) {
    .ps-cta { width: auto; }
  }
  @media (min-width: 640px) {
    .ps-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ps-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 1024px) {
    .ps__inner { padding-inline: 32px; }
    .ps-tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    /* the picture beside the words. The line keeps two lines' room, so the panel keeps its height from one service to the next. */
    .ps-stage { flex-direction: row; align-items: stretch; }
    .ps-stage__art { flex: 5 1 260px; }
    .ps-stage__text { flex: 6 1 280px; }
    .ps-stage__line { min-height: 3.1em; }
  }
  @media (min-width: 1024px) and (max-width: 1279.98px) {
    /* where five of the form's questions wrap to a second row, every service keeps that row's room */
    .ps-chips--asks { min-height: 62px; }
  }

  /* ── 6 · pointer and motion ──────────────────────────────────────────────────────────────────── */
  @media (hover: hover) {
    .ps-tile[aria-pressed="false"]:hover { border-color: var(--hero-violet-2); }
    .ps-cta:not(:disabled):hover { filter: brightness(1.04); }
    .ps-close:hover, .ps-link__remove:hover, .ps-add:hover { border-color: var(--hero-violet-2); }
    .ps-pick[aria-pressed="false"]:hover { border-color: var(--hero-violet-2); }
    .ps-more:hover { color: var(--hero-violet-2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ps-tile, .ps-cta, .ps-pick { transition: none; }
  }

  /* ── THIS PAGE'S OWN: not part of the design, not ported ─────────────────────────────────────── */
  body { margin: 0; background-color: rgb(var(--bg)); }
</style>
<style>
  /* ── HOME-TRIM-03 · NEW WITH THIS SECTION: what the short view adds. The only rules to port. ─────────────── */
  /* the section's top and foot, as the boards draw them: 44px each up to 400px wide; 72px and 64px from 1400px */
  .ps--short .ps__inner { padding-top: clamp(44px, 2.8vw + 32.8px, 72px); padding-bottom: clamp(44px, 2vw + 36px, 64px); }
  /* under the services: the picked one's name and line, then its button and its note, in one row when there is room */
  .ps-brief {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px 40px;
    margin-top: clamp(18px, 1.8vw, 24px); padding-top: clamp(18px, 1.8vw, 24px); border-top: 1px solid var(--fs-rule);
  }
  .ps-brief__text { flex: 1 1 420px; min-width: 0; }
  .ps-brief__go { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  /* the door to the whole section, under the panel, in the plans' link type */
  .ps-how {
    display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.3; font-weight: 500; letter-spacing: 0.04em;
    color: var(--hero-violet-3); text-decoration: none;
  }
  @media (hover: hover) {
    .ps-how:hover { color: var(--hero-violet-2); }
  }
</style>
</head>
<body>

<!-- ServicesSection.tsx, the home page's short view, at rest: the first service is picked. -->
<section class="ps ps--short" id="services" aria-labelledby="ps-title">
  <div class="ps__inner">
    <h2 class="ps__title" id="ps-title">Professional Services</h2>
    <p class="ps__lede">Hands-on services, tailored to your needs.</p>

    <div class="ps-panel">
      <h3 class="ps-panel__question" id="ps-question">What do you need?</h3>
      <div class="ps-tiles" role="group" aria-labelledby="ps-question">
          <button class="ps-tile" type="button" aria-pressed="true" data-done-for-you="setup"><svg class="ps-tile__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3.5"></rect><path d="M3 9.2h18M7.2 12.6h3.6v3.4H7.2zM13.2 12.6h3.6v3.4h-3.6z"></path></svg><span class="ps-tile__words"><span class="ps-tile__title">Full setup</span><span class="ps-tile__kind">Project</span></span></button>
          <button class="ps-tile" type="button" aria-pressed="false" data-done-for-you="maintenance"><svg class="ps-tile__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12.4a7.5 7.5 0 0 1 -13 4.7M4.5 11.6a7.5 7.5 0 0 1 13 -4.7M17.8 3.4v3.8H14M6.2 20.6v-3.8H10"></path></svg><span class="ps-tile__words"><span class="ps-tile__title">Monthly maintenance</span><span class="ps-tile__kind">Monthly</span></span></button>

<script>
  // REFERENCE ONLY: this makes the file work on its own. Production keeps the pick in React state, as the whole view does.
  const SERVICES = [["setup", "Full setup", "Your own hosted copy, every API wired, you own everything."], ["maintenance", "Monthly maintenance", "I keep it updated and running."], ["custom", "Custom builds", "Need a feature? I build it."], ["embed", "Integration", "One piece of this system (the booking engine, the books, the scanner) wired into the system you already run."], ["bookkeeping", "Bookkeeping", "Fell behind, or need a bookkeeper? Catch-up and monthly bookkeeping, billed monthly — the price follows your volume."], ["unsure", "Something else", "Out of scope, or not sure which fits? Tell me what you need."]];
  const section = document.querySelector('.ps--short');
  const cta = section.querySelector('.ps-brief .ps-cta');

  function pick(need) {
    const [, title, line] = SERVICES.find(([key]) => key === need);
    for (const tile of section.querySelectorAll('.ps-tile')) tile.setAttribute('aria-pressed', String(tile.dataset.doneForYou === need));
    section.querySelector('.ps-brief .ps-stage__title').textContent = title;
    section.querySelector('.ps-brief .ps-stage__line').textContent = line;
    cta.setAttribute('href', '/work-with-me?need=' + need);
  }

  for (const tile of section.querySelectorAll('.ps-tile')) tile.addEventListener('click', () => pick(tile.dataset.doneForYou));
</script>
