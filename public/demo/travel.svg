<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- LANDING-04-ILLOS: the Travel pipeline, as it actually runs.
       Stages read from: the live search modes (travelStripModes.tsx:104+,
       flights/hotels/transfers/activities) -> booking on the page
       (TRAVEL_TRUST_CHIPS 'Book on this page', travelStripModes.tsx:92-102)
       -> the trip budget ledger's planned-vs-actual lens
       (TripBudgetActual.tsx:4-34, GET /api/trips/[id]/actuals). -->
  <!-- Canvas: ts-bg cream. Cards: ts-white on ts-border hairline.
       Active step: ts-purple fill, ts-white ink. Accent: ts-gold.
       Text ladder: ts-text #1a1a2e / ts-text-secondary #4a4a5a /
       ts-text-muted #7a7488 / ts-text-faint #a8a2b0.
       (Token names drop their CSS custom-property prefix on purpose: this
       file is parsed as a STANDALONE XML document when it is served to an
       img tag, and XML forbids a double hyphen inside a comment. Spelling
       the prefix out made all nine files fail to parse - every frame
       rendered as alt text on the Preview.)
       -->
  <rect width="1200" height="750" fill="#FAF8F3"/>
  <text x="60" y="76" font-size="20" font-weight="600" letter-spacing="6" fill="#7a7488">TRAVEL</text>

  <!-- 01 SEARCH -->
  <rect x="60" y="150" width="304" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="88" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">01</text>
  <text x="88" y="352" font-size="34" font-weight="700" letter-spacing="1" fill="#1a1a2e">SEARCH</text>
  <rect x="88" y="420" width="144" height="40" rx="8" fill="#F3EFE6"/>
  <text x="103" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">LIVE FARES</text>
  <line x1="380" y1="385" x2="426" y2="385" stroke="#a8a2b0" stroke-width="3"/>
  <path d="M 426 374 L 442 385 L 426 396 Z" fill="#a8a2b0"/>

  <!-- 02 BOOK -->
  <rect x="448" y="150" width="304" height="470" rx="14" fill="#3b2d6b"/>
  <text x="476" y="202" font-size="16" letter-spacing="4" fill="#FFFDF9" opacity="0.6">02</text>
  <text x="476" y="337" font-size="34" font-weight="700" letter-spacing="1" fill="#FFFDF9">BOOK</text>
  <text x="476" y="385" font-size="15" letter-spacing="3" fill="#FFFDF9" opacity="0.75">&#9679; YOU ARE HERE</text>
  <rect x="476" y="435" width="224" height="40" rx="8" fill="#ffffff"/>
  <text x="491" y="461" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#3b2d6b">NO ACCOUNT NEEDED</text>
  <line x1="768" y1="385" x2="814" y2="385" stroke="#a8a2b0" stroke-width="3"/>
  <path d="M 814 374 L 830 385 L 814 396 Z" fill="#a8a2b0"/>

  <!-- 03 LANDS IN -->
  <rect x="836" y="150" width="304" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="864" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">03</text>
  <text x="864" y="317" font-size="34" font-weight="700" letter-spacing="1" fill="#1a1a2e">LANDS IN</text>
  <text x="864" y="361" font-size="34" font-weight="700" letter-spacing="1" fill="#1a1a2e">YOUR BUDGET</text>
  <text x="864" y="463" font-size="46" font-weight="700" fill="#B8860B">$1,240</text>
  <text x="864" y="495" font-size="15" letter-spacing="2" fill="#7a7488">PLANNED VS ACTUAL</text>
</svg>
