<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <!-- LANDING-04-FRAMES-SIX: TRAVEL, step 02 of 03 (BOOK).
       The panel is that step's own screen: what you book and the travel
       account each booking lands in.
       Vendors are the real integrations (TravelShowcaseSections.tsx hero:
       flights Duffel, hotels LiteAPI, activities and transfers Viator).
       The account codes are the REAL vendor map, VENDOR_TYPE_TO_COA in
       src/app/api/trips/[id]/vendor-commit/route.ts:11-17 (flight 9100,
       lodging 9200, vehicle 9300, transfer 9600, activity 9400). The one
       amount is the carried example trip: Portland food-truck festival,
       Portland OR, budget 450, committed as activity COA 9400 at 450
       (TravelShowcaseSections.tsx:90-92, :54).
       NOT DRAWN, declared: the handoff sketch asked for a DR travel /
       CR cash journal entry. The vendor-commit route carries no counter
       account in the example data, so no entry is drawn rather than
       inventing one. Step 03 uses the app's own string 'IN BOOKS' (the
       Trade StageStrip COMMIT chip, ModuleLauncher.tsx:961).
       No live indicator: the trip surface shows none (ruling 5). -->
  <rect x="0.0" y="0.0" width="1200.0" height="750.0" fill="#FAF8F3"/>
  <text id="t1" x="36.0" y="53.0" font-family="'IBM Plex Mono', monospace" font-size="22" fill="#7a7488" font-weight="500" letter-spacing="6.60">TRAVEL</text>
  <text id="t2" x="1164.0" y="53.0" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#a8a2b0" letter-spacing="3.20" text-anchor="end">STEP 02 OF 03</text>
