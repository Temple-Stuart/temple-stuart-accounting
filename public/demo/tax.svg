<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- LANDING-04-ILLOS: the Tax pipeline, as it actually runs.
       Stages read from: the closed-books handoff gate
       (home/TaxHandoffGate.tsx - the wizard opens once a period is
       closed) and the wizard's own STEPS list
       (tax-filing/TaxFilingWizard.tsx:58-105 - Life events, Documents,
       Income, Deductions, Trading, Review, File = 7 steps). -->
  <!-- Canvas: --ts-bg cream. Cards: --ts-white on --ts-border hairline.
       Active step: --ts-purple fill, --ts-white ink. Accent: --ts-gold.
       Text ladder: --ts-text #1a1a2e / --ts-text-secondary #4a4a5a /
       --ts-text-muted #7a7488 / --ts-text-faint #a8a2b0. -->
  <rect width="1200" height="750" fill="#FAF8F3"/>
  <text x="60" y="76" font-size="20" font-weight="600" letter-spacing="6" fill="#7a7488">TAX</text>

  <!-- 01 CLOSED -->
  <rect x="60" y="150" width="237" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="88" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">01</text>
  <text x="88" y="336" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">CLOSED</text>
  <text x="88" y="374" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">BOOKS</text>
  <rect x="88" y="436" width="178" height="40" rx="8" fill="#F3EFE6"/>
  <text x="103" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">PERIOD CLOSED</text>
  <path d="M 320 374 L 335 385 L 320 396 Z" fill="#a8a2b0"/>

  <!-- 02 FORMS -->
  <rect x="341" y="150" width="237" height="470" rx="14" fill="#3b2d6b"/>
  <text x="369" y="202" font-size="16" letter-spacing="4" fill="#FFFDF9" opacity="0.6">02</text>
  <text x="369" y="321" font-size="28" font-weight="700" letter-spacing="1" fill="#FFFDF9">FORMS</text>
  <text x="369" y="359" font-size="28" font-weight="700" letter-spacing="1" fill="#FFFDF9">BUILD</text>
  <text x="369" y="401" font-size="15" letter-spacing="3" fill="#FFFDF9" opacity="0.75">&#9679; YOU ARE HERE</text>
  <rect x="369" y="451" width="190" height="40" rx="8" fill="#ffffff"/>
  <text x="384" y="477" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#3b2d6b">1040 + SCH C/D</text>
  <path d="M 601 374 L 616 385 L 601 396 Z" fill="#a8a2b0"/>

  <!-- 03 REVIEW -->
  <rect x="622" y="150" width="237" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="650" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">03</text>
  <text x="650" y="342" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">REVIEW</text>
  <text x="650" y="438" font-size="46" font-weight="700" fill="#B8860B">7</text>
  <text x="650" y="470" font-size="15" letter-spacing="2" fill="#7a7488">WIZARD STEPS</text>
  <path d="M 882 374 L 897 385 L 882 396 Z" fill="#a8a2b0"/>

  <!-- 04 FILE -->
  <rect x="903" y="150" width="237" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="931" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">04</text>
  <text x="931" y="355" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">FILE</text>
  <rect x="931" y="417" width="133" height="40" rx="8" fill="#F3EFE6"/>
  <text x="946" y="443" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">FORM 8949</text>
</svg>
