<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- LANDING-04-ILLOS: the Content pipeline, as it actually runs.
       Stages read from the pipeline's own stage state
       (workbench/operations/content/ContentPipeline.tsx:85
       'calendar' | 'log' | 'script', the three keep-mounted surfaces
       :350, :352, :514 - DayCalendar, the day log, ScriptGenerator). -->
  <!-- Canvas: --ts-bg cream. Cards: --ts-white on --ts-border hairline.
       Active step: --ts-purple fill, --ts-white ink. Accent: --ts-gold.
       Text ladder: --ts-text #1a1a2e / --ts-text-secondary #4a4a5a /
       --ts-text-muted #7a7488 / --ts-text-faint #a8a2b0. -->
  <rect width="1200" height="750" fill="#FAF8F3"/>
  <text x="60" y="76" font-size="20" font-weight="600" letter-spacing="6" fill="#7a7488">CONTENT</text>

  <!-- 01 WHAT -->
  <rect x="60" y="150" width="304" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="88" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">01</text>
  <text x="88" y="330" font-size="34" font-weight="700" letter-spacing="1" fill="#1a1a2e">WHAT</text>
  <text x="88" y="374" font-size="34" font-weight="700" letter-spacing="1" fill="#1a1a2e">YOU DID</text>
  <rect x="88" y="442" width="156" height="40" rx="8" fill="#F3EFE6"/>
  <text x="103" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">TODAY'S LOG</text>
  <line x1="380" y1="385" x2="426" y2="385" stroke="#a8a2b0" stroke-width="3"/>
  <path d="M 426 374 L 442 385 L 426 396 Z" fill="#a8a2b0"/>

  <!-- 02 SCENES -->
  <rect x="448" y="150" width="304" height="470" rx="14" fill="#3b2d6b"/>
  <text x="476" y="202" font-size="16" letter-spacing="4" fill="#FFFDF9" opacity="0.6">02</text>
  <text x="476" y="324" font-size="34" font-weight="700" letter-spacing="1" fill="#FFFDF9">SCENES</text>
  <text x="476" y="372" font-size="15" letter-spacing="3" fill="#FFFDF9" opacity="0.75">&#9679; YOU ARE HERE</text>
  <text x="476" y="456" font-size="46" font-weight="700" fill="#FFFDF9">5</text>
  <text x="476" y="488" font-size="15" letter-spacing="2" fill="#FFFDF9" opacity="0.8">SHOTS PLANNED</text>
  <line x1="768" y1="385" x2="814" y2="385" stroke="#a8a2b0" stroke-width="3"/>
  <path d="M 814 374 L 830 385 L 814 396 Z" fill="#a8a2b0"/>

  <!-- 03 SCRIPT -->
  <rect x="836" y="150" width="304" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="864" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">03</text>
  <text x="864" y="352" font-size="34" font-weight="700" letter-spacing="1" fill="#1a1a2e">SCRIPT</text>
  <rect x="864" y="420" width="178" height="40" rx="8" fill="#F3EFE6"/>
  <text x="879" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">READY TO FILM</text>
</svg>
