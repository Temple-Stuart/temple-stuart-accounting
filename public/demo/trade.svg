<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <!-- LANDING-04-FRAME-TRADE: TRADE, step 03 of 04 (VERDICTS).
       The panel is that step's own screen: the scanner results table.
       Shape and semantics read from
       src/components/convergence/ScannerResultsTable.tsx: the row columns
       (:624 TICKER, STRATEGY, PREMIUM, POP, EV, VERDICT; PREMIUM is
       deliberately dropped here), verdict 'trade' vs 'skip' (:160),
       TRADE from a real trade card (:480), SKIP from the STORED rejection
       reason (:491) which the table renders uppercased (:717), and the
       TRADE/SKIP tally reported by onTally (:502-505).
       ABBREVIATED LABEL, declared: the drawn skip reasons 'PoP BELOW GATE'
       and 'EV BELOW FLOOR' are SHORT LABELS, not the app's verbatim
       strings. The real format is built in
       src/lib/convergence/filter-engine.ts:219 and :225, e.g.
       'Est. PoP 57% below min 60%' and 'Est. EV $-8 below min $0'. Those
       run 329px and 303px at the 18px floor against a 192px cell, so the
       label stands in for them at this size (Alex's ruling 1).
       Step 04's name is the APP'S OWN STRING: the Trade StageStrip's
       COMMIT link chip renders 'IN BOOKS' with an arrow
       (src/components/home/ModuleLauncher.tsx:961). The handoff wrote
       'IN YOUR BOOKS', which measures 226.6px against a 216.5px cell at
       the 28px step-name scale; the app's shorter string fits at that
       same scale (138.5px) and is the truer label (Alex's ruling).
       No live indicator is drawn: the real results surface has none
       (ruling 5). Its only row marker is a QUEUED TO LAB queue chip
       (:720), and the results header carries a COMPLETED timestamp, not a
       live one.
       Tokens: bg cream, white cards, bg-row bands, purple active step,
       gold money, green TRADE chip, red SKIP chip, border hairlines. -->
