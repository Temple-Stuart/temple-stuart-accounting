<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- PR-DEMO-1: code-drawn illustration of the live Trade scanner.
       Sources: table headers Score/Strategy/Est. PoP = ScannerResultsTable.tsx
       :581-588 (DTE from its SortKey :153); metric labels Convergence score /
       IV Rank / VRP (IV minus HV) / Max loss = metricExplainers.ts titles;
       "Iron Condor" = verified house strategy vocabulary (convergence
       components, 19 occurrences). Values neutral/innocuous; dollar cells are
       dashes (no invented performance numbers). SPY = a real public index ETF
       symbol. Palette = ds.ts dark vocabulary literals. -->
  <defs>
    <radialGradient id="glowA" cx="80%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#3b2d6b" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#3b2d6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="10%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#2d1b4e" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#2d1b4e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" rx="16" fill="#0d1117"/>
  <rect width="1200" height="800" rx="16" fill="url(#glowA)"/>
  <rect width="1200" height="800" rx="16" fill="url(#glowB)"/>

  <text x="48" y="72" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3" fill="#ffffff" opacity="0.5">SCANNER</text>

  <!-- One strategy card -->
  <rect x="48" y="100" width="1104" height="300" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="164" font-size="30" font-weight="300" fill="#ffffff">SPY</text>
  <rect x="160" y="138" width="130" height="32" rx="16" fill="#3b2d6b" opacity="0.5"/>
  <text x="225" y="159" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.9">Iron Condor</text>

  <g font-family="ui-monospace, Menlo, monospace">
    <text x="80" y="230" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">CONVERGENCE SCORE</text>
    <text x="80" y="262" font-size="24" fill="#ffffff">0.72</text>
    <text x="360" y="230" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">IV RANK</text>
    <text x="360" y="262" font-size="24" fill="#ffffff">54</text>
    <text x="560" y="230" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">EST. POP</text>
    <text x="560" y="262" font-size="24" fill="#16a34a">68%</text>
    <text x="760" y="230" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">VRP (IV MINUS HV)</text>
    <text x="760" y="262" font-size="24" fill="#ffffff">+3.1</text>
    <text x="1000" y="230" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">DTE</text>
    <text x="1000" y="262" font-size="24" fill="#ffffff">45</text>

    <text x="80" y="322" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">MAX PROFIT</text>
    <text x="80" y="354" font-size="24" fill="#ffffff" opacity="0.4">—</text>
    <text x="360" y="322" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">MAX LOSS</text>
    <text x="360" y="354" font-size="24" fill="#ffffff" opacity="0.4">—</text>
    <text x="560" y="322" font-size="12" letter-spacing="1.5" fill="#ffffff" opacity="0.5">EXPECTED VALUE (EV)</text>
    <text x="560" y="354" font-size="24" fill="#ffffff" opacity="0.4">—</text>
  </g>

  <!-- Results table hint (real headers; ghost rows, no values) -->
  <rect x="48" y="432" width="1104" height="320" rx="12" fill="#161b22" stroke="#30363d"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#ffffff" opacity="0.5">
    <text x="80" y="486">SYMBOL</text>
    <text x="320" y="486">SCORE</text>
    <text x="540" y="486">STRATEGY</text>
    <text x="880" y="486">EST. POP</text>
  </g>
  <line x1="80" y1="506" x2="1120" y2="506" stroke="#30363d"/>
  <rect x="80" y="540" width="90" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="320" y="540" width="70" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="540" y="540" width="220" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="880" y="540" width="70" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <line x1="80" y1="580" x2="1120" y2="580" stroke="#30363d"/>
  <rect x="80" y="614" width="90" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="320" y="614" width="70" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="540" y="614" width="180" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="880" y="614" width="70" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <line x1="80" y1="654" x2="1120" y2="654" stroke="#30363d"/>
  <rect x="80" y="688" width="90" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="320" y="688" width="70" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="540" y="688" width="240" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
  <rect x="880" y="688" width="70" height="14" rx="7" fill="#ffffff" opacity="0.12"/>
</svg>
