<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- LANDING-04-ILLOS: the Trade pipeline, as it actually runs.
       Stages read from the Trade StageStrip phase config
       (ModuleLauncher.tsx: 01 SETUP 'UNIVERSE + FILTERS' ->
       02 SCAN 'RUN THE PIPELINE' -> 03 REVIEW 'PICK CANDIDATES'),
       the TRADE/SKIP verdict rows (ScannerResultsTable.tsx verdict +
       stored RejectionReason), and the strip's COMMIT link chip
       ('IN BOOKS ->', selectTab('books')). The '18 CONTROLS' chip is a
       VERIFIED structural fact, not an illustrative figure:
       ScanFilterForm renders all 18 ScannerFilters fields
       (ScanFilterForm.tsx:13-15), and the deck bullet 'Eighteen
       controls, sixteen strategies' ships on this same page
       (Landing.tsx PILLAR_CARDS trade). -->
  <!-- Canvas: ts-bg cream. Cards: ts-white on ts-border hairline.
       Active step: ts-purple fill, ts-white ink. Accent: ts-gold.
       Text ladder: ts-text #1a1a2e / ts-text-secondary #4a4a5a /
       ts-text-muted #7a7488 / ts-text-faint #a8a2b0.
       (Token names drop their CSS custom-property prefix on purpose: this
       file is parsed as a STANDALONE XML document when it is served to an
       img tag, and XML forbids a double hyphen inside a comment. Spelling
       the prefix out made all nine files fail to parse - every frame
       rendered as alt text on the Preview.)
       -->
  <rect width="1200" height="750" fill="#FAF8F3"/>
  <text x="60" y="76" font-size="20" font-weight="600" letter-spacing="6" fill="#7a7488">TRADE</text>

  <!-- 01 FILTERS -->
  <rect x="60" y="150" width="237" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="88" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">01</text>
  <text x="88" y="355" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">FILTERS</text>
  <rect x="88" y="417" width="153" height="40" rx="8" fill="#F3EFE6"/>
  <text x="103" y="443" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">18 CONTROLS</text>
  <path d="M 320 374 L 335 385 L 320 396 Z" fill="#a8a2b0"/>

  <!-- 02 SCAN -->
  <rect x="341" y="150" width="237" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="369" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">02</text>
  <text x="369" y="355" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">SCAN</text>
  <rect x="369" y="417" width="153" height="40" rx="8" fill="#F3EFE6"/>
  <text x="384" y="443" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">LIVE PRICES</text>
  <path d="M 601 374 L 616 385 L 601 396 Z" fill="#a8a2b0"/>

  <!-- 03 VERDICTS -->
  <rect x="622" y="150" width="237" height="470" rx="14" fill="#3b2d6b"/>
  <text x="650" y="202" font-size="16" letter-spacing="4" fill="#FFFDF9" opacity="0.6">03</text>
  <text x="650" y="340" font-size="28" font-weight="700" letter-spacing="1" fill="#FFFDF9">VERDICTS</text>
  <text x="650" y="382" font-size="15" letter-spacing="3" fill="#FFFDF9" opacity="0.75">&#9679; YOU ARE HERE</text>
  <rect x="650" y="432" width="86" height="40" rx="8" fill="#16a34a"/>
  <text x="665" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#FFFDF9">TRADE</text>
  <rect x="748" y="432" width="75" height="40" rx="8" fill="#c53030"/>
  <text x="763" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#FFFDF9">SKIP</text>
  <path d="M 882 374 L 897 385 L 882 396 Z" fill="#a8a2b0"/>

  <!-- 04 IN YOUR -->
  <rect x="903" y="150" width="237" height="470" rx="14" fill="#FFFDF9" stroke="#DDD6E8" stroke-width="2"/>
  <text x="931" y="202" font-size="16" letter-spacing="4" fill="#a8a2b0">04</text>
  <text x="931" y="336" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">IN YOUR</text>
  <text x="931" y="374" font-size="28" font-weight="700" letter-spacing="1" fill="#1a1a2e">BOOKS</text>
  <rect x="931" y="436" width="97" height="40" rx="8" fill="#F3EFE6"/>
  <text x="946" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#4a4a5a">COMMIT</text>
</svg>
