<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- PR-DEMO-1: code-drawn illustration of the live Compliance workbench.
       Sources: the eight citation-check names (Existence / Currency /
       Groundedness / Jurisdiction / Pinpoint / Source authority /
       Supersession / Content hash) + the two method strings ('HEAD/GET to
       canonical URL', 'SHA-256 chunk text vs recorded hash') =
       SectionG_CitationVerification.tsx verbatim; AUDIT TAIL =
       SectionI_AuditTail.tsx. Hash fragments are innocuous samples.
       Palette = ds.ts dark vocabulary literals. -->
  <defs>
    <radialGradient id="glowA" cx="80%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#3b2d6b" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#3b2d6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="10%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#2d1b4e" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#2d1b4e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" rx="16" fill="#0d1117"/>
  <rect width="1200" height="800" rx="16" fill="url(#glowA)"/>
  <rect width="1200" height="800" rx="16" fill="url(#glowB)"/>

  <text x="48" y="72" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3" fill="#ffffff" opacity="0.5">CITATION VERIFICATION</text>

  <!-- Left: the eight real checks -->
  <rect x="48" y="100" width="530" height="652" rx="12" fill="#161b22" stroke="#30363d"/>
  <g font-size="17">
    <path d="M 84 148 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="154" fill="#ffffff" opacity="0.9">Existence</text>
    <path d="M 84 222 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="228" fill="#ffffff" opacity="0.9">Currency</text>
    <path d="M 84 296 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="302" fill="#ffffff" opacity="0.9">Groundedness</text>
    <path d="M 84 370 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="376" fill="#ffffff" opacity="0.9">Jurisdiction</text>
    <path d="M 84 444 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="450" fill="#ffffff" opacity="0.9">Pinpoint</text>
    <path d="M 84 518 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="524" fill="#ffffff" opacity="0.9">Source authority</text>
    <path d="M 84 592 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="598" fill="#ffffff" opacity="0.9">Supersession</text>
    <path d="M 84 666 l 6 7 l 12 -13" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="120" y="672" fill="#ffffff" opacity="0.9">Content hash</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#ffffff" opacity="0.4">
    <text x="120" y="178">HEAD/GET to canonical URL</text>
    <text x="120" y="696">SHA-256 chunk text vs recorded hash</text>
  </g>

  <!-- Right: the tamper-evident audit tail (hash chain) -->
  <rect x="602" y="100" width="550" height="652" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="634" y="156" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#ffffff" opacity="0.5">AUDIT TAIL</text>

  <rect x="634" y="192" width="486" height="96" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="662" y="230" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#ffffff" opacity="0.7">sha256: a3f1…</text>
  <rect x="662" y="248" width="380" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
  <line x1="877" y1="288" x2="877" y2="320" stroke="#4e3e85" stroke-width="2"/>

  <rect x="634" y="320" width="486" height="96" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="662" y="358" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#ffffff" opacity="0.7">sha256: 9c40…</text>
  <rect x="662" y="376" width="330" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
  <line x1="877" y1="416" x2="877" y2="448" stroke="#4e3e85" stroke-width="2"/>

  <rect x="634" y="448" width="486" height="96" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="662" y="486" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#ffffff" opacity="0.7">sha256: e72b…</text>
  <rect x="662" y="504" width="410" height="12" rx="6" fill="#ffffff" opacity="0.08"/>

  <rect x="634" y="592" width="486" height="120" rx="8" fill="#0d1117" stroke="#30363d"/>
  <rect x="662" y="624" width="340" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
  <rect x="662" y="652" width="260" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
  <rect x="662" y="680" width="300" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
</svg>
